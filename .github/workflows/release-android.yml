# Builds a signed Android APK and attaches it to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#     git tag v1.2.3 && git push origin v1.2.3
# The release (with auto-generated notes) is created automatically and the
# artifact is attached as a downloadable asset.
#
# Manual runs (workflow_dispatch) build the artifact and upload it to the run only —
# no release is created. That is how to test this pipeline.
#
# Channel: a manual run may ask for a tester build in the `preview` channel
# (EXPO_PUBLIC_CORRECTIV_CHANNEL=preview), which reaches the features `features.json`
# marks `vorschau` — ADR 0072 §2's explicit manual input. It defaults to `release`,
# every tag build is `release`, and the release job only runs on a tag, so a preview
# APK never reaches a store track. The artifact name carries the channel so the two
# are told apart in the run's file list.
#
# Signing:
#   - If the ANDROID_KEYSTORE_* secrets are set (see RELEASE.md), the APK is signed
#     with the real upload key.
#   - If they are NOT set, it falls back to the committed throwaway TEST keystore
#     (apps/mobile/signing/correctiv-test.keystore) — an installable test build
#     only. Never use the test key for the Play Store.
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key (alias) password
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      preview:
        description: 'Tester build: reach the features marked `vorschau` (ADR 0072 §2)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # required to create the release and upload assets

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      real: ${{ steps.sign.outputs.real }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      - name: Install dependencies
        run: npm ci

      # Drive version and versionCode from the tag, before prebuild writes them into
      # build.gradle. The run number is the versionCode because Play requires it to
      # increase on every upload, and it is the only number that always does.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "apps/mobile/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            j.expo.android = { ...j.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(`versionName=${j.expo.version} versionCode=${j.expo.android.versionCode}`);
          '

      # A tag and a preview build cannot be the same artifact: the release job below
      # attaches whatever this job built to the GitHub Release of that tag, and a
      # tester APK on a release page reaches anybody who finds it. Refused here,
      # where the reason is visible, rather than by skipping the attach afterwards.
      - name: Refuse a preview build on a tag
        if: startsWith(github.ref, 'refs/tags/') && inputs.preview
        run: |
          echo "::error::A tagged run is a release. Run the workflow manually from a branch to get a preview build."
          exit 1

      # android/ is gitignored: it is generated from app.json. --no-install because
      # npm ci already ran at the ROOT.
      - name: Prebuild the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # EXPO_PUBLIC_ is inlined into the JS bundle by Metro, and the bundle is built
      # here rather than by `expo export`, so the variable has to be in THIS step's
      # environment. `apps/mobile/src/lib/channel.ts` reads it and nothing else does:
      # anything but the exact value `preview` is `release`, which is what a tag build
      # and any workflow_dispatch without the box ticked both get.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_CORRECTIV_CHANNEL: ${{ inputs.preview && 'preview' || 'release' }}
        run: ./gradlew assembleRelease

      # Gradle signs the release variant with the template's debug key, which is
      # generated per machine — two builds of the same commit would carry two
      # identities and testers could not update in place. apksigner replaces the
      # signature with a stable one; the APK is already zipaligned by Gradle.
      #
      # The file and the artifact carry the channel, so a tester build is
      # distinguishable in the run's file list by its name and not by reading the
      # bundle. The release name is unchanged, because the asset name on a GitHub
      # Release is a published URL.
      - name: Sign with the release key
        id: sign
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'correctiv-test' }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'correctiv-test' }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'correctiv-test' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CHANNEL: ${{ inputs.preview && 'preview' || 'release' }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            KS_PATH="${RUNNER_TEMP}/release.keystore"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — signing with the committed TEST keystore. The result is NOT for the Play Store."
            KS_PATH="${GITHUB_WORKSPACE}/apps/mobile/signing/correctiv-test.keystore"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          mkdir -p dist
          if [ "$CHANNEL" = "preview" ]; then
            NAME="correctiv-app-preview-${GITHUB_REF_NAME}"
          else
            NAME="correctiv-app-${GITHUB_REF_NAME}"
          fi
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          "$APKSIGNER" sign \
            --ks "$KS_PATH" --ks-pass "pass:${KS_PASSWORD}" \
            --ks-key-alias "$KS_ALIAS" --key-pass "pass:${KS_KEY_PASSWORD}" \
            "dist/${NAME}.apk"
          "$APKSIGNER" verify --print-certs "dist/${NAME}.apk"
          ls -lh dist

      # A preview build lands in its own artifact, so the two are told apart by name
      # in the run's file list. The release job downloads `release-android` by name,
      # and a tagged run is refused above if it is a preview build, so nothing that is
      # not a release can reach a GitHub Release through this name.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preview && 'preview-android' || 'release-android' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the GitHub Release
    runs-on: ubuntu-latest
    needs: [android]
    # Only tags create a release; a manual run stops after the build, with the APK on
    # the run itself.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Named, so the artifact a preview build would upload under a different name
      # cannot be picked up here by the default of "every artifact in the run".
      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
          merge-multiple: true

      - run: ls -lhR dist

      - name: Attach
        # Pinned to a full commit SHA (supply-chain hardening for this
        # third-party action, which runs with contents: write).
        # Bump deliberately; check https://github.com/softprops/action-gh-release/releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          # In the TEST-keystore fallback there is no AAB, so don't fail on it.
          fail_on_unmatched_files: false
          generate_release_notes: true
          append_body: true
          body: |
            ${{ needs.android.outputs.real == 'true' && '' || '> ⚠️ **Test build**, signed with the in-repo test key, **not** for the Play Store. For sideloading and testing only.' }}
