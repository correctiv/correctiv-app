# Publishes the workbench and the app to GitHub Pages — https://correctiv.github.io/correctiv-app/
#
# TWO BUILDS, ONE ARTIFACT. The site root is the workbench: the repository's own
# documentation, the source inventory, the diagrams and the reference, rendered as
# a React app (apps/workbench). The web export of the app is published beneath it at
# /app/, and the workbench frames it.
#
# The app used to own the root, and this workflow said in its own comments that the
# root was the wrong place to send people: the app has no desktop layout, so a full
# browser window is the wrong shape to judge it in, and the address handed out was
# /preview.html instead. The workbench fills that gap, so the root is now a page that
# is meant to be read at that size.
#
# WHY THIS IS SAFE FOR THE INSPECTOR. Everything the preview shell does to the app is
# a same-origin property access: contentWindow, matchMedia, documentElement.classList,
# localStorage, and the handle the app leaves on its own global. None of it is
# path-sensitive, and both halves are uploaded here as ONE artifact, so `/` and
# `/app/` are the same origin and framing works. ADR 0014 put the shell inside
# apps/mobile/public/ to get that guarantee; assembling one origin at deploy time is
# a second way to the same thing, and it is the one that lets the workbench own the
# root. In development the workbench's Vite server proxies /app to the app's dev
# server, which is the same trick locally.
#
# ONE-TIME SETUP, and this workflow cannot do it for you: the site's source has to be
# switched from `main:/docs` to GitHub Actions. Settings → Pages → Build and
# deployment → Source: GitHub Actions, or:
#
#     gh api -X POST repos/correctiv/correctiv-app/pages -f build_type=workflow
#
# `actions/configure-pages` below only creates a site when none exists — it reads an
# existing one and leaves its build type alone — so until the switch is made,
# `deploy-pages` fails with "Not configured to use GitHub Actions".
#
# The demo runs on live content since ADR 0015: correctiv.org's REST API reflects the
# Origin, so a browser reaches it. The bundle below is the floor when a request fails.
# Only the RSS feeds send no CORS header, so every feed request fails in a browser and
# the store's cascade lands on the snapshot from `npm run offline-articles`. Re-run
# that generator and merge it before you want the published demo to show recent
# articles — TROUBLESHOOTING.md, "The web target".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress — a half-published site is worse than a stale
# one. Queue instead, which is the opposite of what ci.yml wants.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # The site root is now the address to hand out: it is the workbench's landing
    # page, which introduces the documentation and links to the app in its frame.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Yields base_path — `/correctiv-app` for a project site. Reading it here beats
      # hard-coding the repo name, which would be wrong the moment the site moves to
      # a custom domain (base_path is then empty and neither build needs a prefix).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A PRODUCTION export, and it has to be. This built a development bundle for
      # a while, to keep the app's dev handle on the published site so the
      # preview's appearance control and inspector would work there. Measured on
      # 2026-09-05, that trade was not the one it looked like: a `--dev` bundle
      # does not apply `experiments.baseUrl` to ROUTE MATCHING, only to asset
      # URLs. The app is published under `/app/`, so every route past the door
      # rendered the app's own 404 while the door itself, which the layout draws
      # outside the router, went on looking fine.
      #
      #   --dev      + base /app  signed in at /app/entdecken -> the app's 404
      #   production + base /app  signed in at /app/entdecken -> Entdecken
      #
      # So the published app works and carries no handle, and the preview says
      # so on the panels that need one. A published app nobody can walk through is
      # not worth a debugging surface on top of it.
      #
      # apps/mobile/app.config.js turns EXPO_BASE_URL into experiments.baseUrl.
      # Without it every asset URL is absolute from the domain root and resolves to
      # correctiv.github.io/_expo/…, which is a blank page served by a green build.
      # The value now carries the /app suffix as well, and experiments.baseUrl takes
      # any depth.
      - name: Export the app
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}/app
        run: npm run build:web

      # GITHUB_SHA reaches the workbench so every link it writes into the source
      # points at the commit the page was built from rather than at main. A page
      # describing a line should keep pointing at that line.
      - name: Build the workbench
        env:
          WORKBENCH_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -w @correctiv/workbench

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site
          cp -r apps/workbench/dist site
          cp -r apps/mobile/dist site/app
          echo "assembled $(find site -name '*.html' | wc -l) pages"

      # The home document the app fetches (ADR 0036 §4, ADR 0057 §4): the core's own
      # file, the same one the app bundles, published at <base>/home.layout.json. The
      # app holds that address as HOME_LAYOUT_URL in apps/mobile/src/lib/home/layout.ts.
      #
      # A step of its own, and it names the core's path and nothing else. That is what
      # keeps it on the right side of ADR 0040 §1: the document is the core's file, not
      # the workbench's output, and this step reads neither the app nor the workbench,
      # so the `independence` job in ci.yml, which deletes apps/workbench and rebuilds
      # the app, removes nothing this path touches.
      - name: Publish the home document
        run: cp packages/app-core/src/data/home.layout.json site/home.layout.json

      # Ways this deploy can be broken while both builds succeed, so each one
      # is read off the assembled files rather than assumed:
      #   1. a component with no web implementation (react-native-webview renders a
      #      sentence instead of the reader, and exports happily)
      #   2. either base path not applied — the failure mode this workflow exists for
      #   3. a missing route, or a missing 404.html, which is what makes deep links
      #      resolve on a host that cannot rewrite
      #   4. the workbench shipping no documents, which is a site with a navigation
      #      and nothing behind it
      #   5. the preview bundled without the app it frames, which is a device
      #      frame around a 404
      #   6. the home document missing or not a clean layout, which every installed
      #      app fetches: the app survives it on its last copy, and says nothing
      - name: Assert the deployable is not silently broken
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail

          if grep -rq "does not support this platform" site/app/; then
            echo "::error::A component without web support reached the web bundle."
            grep -rl "does not support this platform" site/app/ | head
            exit 1
          fi

          grep -q "\"$BASE_PATH/app/_expo/static/js/web/" site/app/index.html || {
            echo "::error::site/app/index.html does not reference $BASE_PATH/app/_expo/ — the base path was not applied, and the app would be blank."
            grep -o 'src="[^"]*"' site/app/index.html | head
            exit 1
          }

          grep -q "\"$BASE_PATH/assets/" site/index.html || {
            echo "::error::site/index.html does not reference $BASE_PATH/assets/ — WORKBENCH_BASE was not applied, and the workbench would be blank."
            grep -o 'src="[^"]*"' site/index.html | head
            exit 1
          }

          for route in index 404 artikel entdecken mediathek mitmachen profil; do
            test -f "site/app/$route.html" || { echo "::error::missing site/app/$route.html"; exit 1; }
          done

          # One real id per dynamic family. A route that loses its
          # generateStaticParams exports as a single dist/<family>/[id].html and
          # every real URL under it 404s on a static host, while the build and
          # every test stay green.
          for route in projekt/abriss-atlas aufruf/wem-gehoert-die-stadt serie/klima tagebuch/diary-bern-2 behauptung/claim-001; do
            test -f "site/app/$route.html" || { echo "::error::missing site/app/$route.html — a dynamic route did not pre-render its ids"; exit 1; }
          done

          # The workbench is a single page application: 404.html is what makes a deep
          # link like /decisions/0022 resolve on a host that cannot rewrite.
          test -f site/404.html || { echo "::error::site/404.html is missing — every workbench deep link would 404."; exit 1; }

          # Both workbench pages carry the Content-Security-Policy, which a Vite
          # plugin writes and nothing else would notice missing (ci.yml says why).
          for page in index 404; do
            grep -q 'http-equiv="Content-Security-Policy"' "site/$page.html" || {
              echo "::error::site/$page.html carries no Content-Security-Policy."
              exit 1
            }
          done

          # And NO stub named after a live route, which is the other half of the
          # same promise. `/preview.html` and `/workbench` are the two addresses this
          # site has moved, and both are answered by `MOVED` in src/router.tsx after
          # 404.html has loaded the shell. A file called preview.html would be served
          # for the clean URL /preview as well — Pages resolves /x by trying x.html
          # before falling through — so the stub that used to keep the old link
          # working would now forward the live page to itself.
          # (ADR 0037; apps/workbench/test/routes.test.ts asks the same of the source.)
          test ! -e site/preview.html || {
            echo "::error::site/preview.html exists. Pages serves it for /preview too, so the live route would redirect to itself. The moved addresses belong in src/router.tsx."
            exit 1
          }

          # A workbench that shipped no documents still renders its navigation, so
          # check that a document's own words reached the bundle.
          grep -rq "platform-free" site/assets/*.js || {
            echo "::error::the workbench bundle carries none of the repository's documents."
            exit 1
          }

          # The preview frames the app across `/` and `/app/`, which are the same
          # origin only because both halves are in this one artifact. If the app's
          # entry is missing, the frame is a 404 in a phone-shaped box.
          test -f site/app/index.html || { echo "::error::site/app/index.html is missing — the preview would frame a 404."; exit 1; }

          # And it has to be a PRODUCTION export. A development bundle leaves the
          # app's dev handle on its global, which is convenient, and does not
          # apply the base path to route matching, which breaks every route past
          # the door. The handle is the tell, so grepping for it is the check.
          if grep -rq '__correctiv' site/app/_expo/; then
            echo "::error::the app bundle carries the dev handle, so build:web exported with --dev. A development bundle ignores experiments.baseUrl when matching routes, and the app is published under $BASE_PATH/app/, so every route past the door would render the app's own 404."
            exit 1
          fi

          # And it must carry no Rozenite. That tooling is development-only by
          # decision (ADR 0026 §1), and — unlike the debugger it replaced — nothing
          # in the toolchain enforces it: `@rozenite/metro` 2.4.0 switches itself on
          # when `enabled` is left undefined, and an explicit `enabled` skips its own
          # `isBundling()` check, so `true` would reach an `expo export` exactly as it
          # reaches `expo start`. What keeps it out here is metro.config.js reading
          # ROZENITE from the environment and nothing in this workflow setting it,
          # which is a discipline rather than a property — so it gets a check.
          #
          # It covers both halves at once, and it greps for the word rather than
          # for an import path because Metro rewrites paths to numeric ids and
          # they do not survive. What survives minification is export names and
          # string literals, and all three packages carry the word in both:
          # `rozeniteDevToolsEnhancer`, `useReduxDevToolsAgentTools`, and the
          # plugin ids `@rozenite/mmkv-plugin` and
          # `@rozenite/react-navigation-plugin`. Measured 2026-09-15 by running
          # this same grep over a `--dev` export with ROZENITE=1, where it hits,
          # and over the production export, where it does not.
          # `test -d` first, and it is not belt-and-braces: a `grep` over a
          # directory that is not there exits 2, the `if` is then false, and this
          # step prints "deployable OK" and deploys. `set -euo pipefail` does not
          # reach inside an `if` condition. A renamed export directory would have
          # turned the check off silently, which is the failure this whole section
          # is about.
          test -d site/app || { echo "::error::site/app is missing — the export did not assemble"; exit 1; }
          if grep -riq 'rozenite' site/app/; then
            echo "::error::the app bundle carries Rozenite. It is development-only tooling: check that metro.config.js still passes an explicit enabled, that ROZENITE is unset here, and that app/_layout.tsx still selects lib/devtools/AgentTools at MODULE scope — a require inside a function keeps its module whatever guards the call."
            grep -ril 'rozenite' site/app/ | head
            exit 1
          fi

          # The home document every installed app fetches. A phone that cannot use it
          # keeps its last good copy, which is correct and invisible, so a broken one
          # would stand unnoticed for as long as nobody compared a phone with the
          # repository. So it is judged by the core's own parser, not by JSON.parse:
          # `{"version":2,"sections":[]}` and `null` are both JSON, and both are an
          # empty home screen. The script is stricter than the app and says why.
          test -f site/home.layout.json || { echo "::error::site/home.layout.json is missing, so every installed app would keep drawing its last copy."; exit 1; }
          npx tsx packages/app-core/scripts/check-home-layout.ts site/home.layout.json || {
            echo "::error::site/home.layout.json is not a home layout the app would draw as written; the lines above name each problem."
            exit 1
          }

          echo "deployable OK — workbench at $BASE_PATH/, app at $BASE_PATH/app/, $(find site -name '*.html' | wc -l) pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
